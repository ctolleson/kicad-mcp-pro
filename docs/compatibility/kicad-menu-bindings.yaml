  "eeschema.InteractiveDrawing.placeSheetPin":
    channel: mcp
    status: covered
    mcp_tool: sch_add_sheet_pin

  "eeschema.InteractiveDrawing.drawSheet":
    channel: mcp
    status: covered
    mcp_tool: sch_create_sheet
    notes: "sch_move_sheet / sch_delete_sheet / sch_set_sheet_size complete the lifecycle."

  "eeschema.InteractiveDrawing.importSheet":
