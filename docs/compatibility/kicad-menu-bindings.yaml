    mcp_tool: sch_annotate
    notes: "Annotate Schematic; sch_annotate assigns references headlessly."

  "eeschema.EditorControl.incrementAnnotations":
    channel: mcp
    status: partial
    mcp_tool: sch_annotate
    notes: "Re-annotation from a starting reference is covered; the increment-from dialog's scoping options are not."

  "eeschema.EditorControl.assignFootprints":
    channel: mcp
    status: covered
    mcp_tool: lib_assign_footprint
    notes: "The headless equivalent of launching CvPcb."

  "eeschema.EditorControl.editSymbolFields":
    channel: mcp
    status: covered
    mcp_tool: sch_update_properties
    notes: "sch_modify_property edits a single field."

  "eeschema.EditorControl.editSymbolLibraryLinks":
    channel: mcp
