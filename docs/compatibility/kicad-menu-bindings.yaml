# How every KiCad menu command maps onto a headless execution path.
#
# The menu tree itself is extracted from KiCad's C++ source by
# scripts/extract_kicad_menus.py into menu_catalog.json. This file answers the
# second question: for each menu command, *can an agent do that without the GUI,
# and how?*
#
# Resolution order for an action name:
#   1. an exact entry in `overrides`
#   2. the first matching prefix in `namespace_rules`
#   3. `default_binding`
#
# Honesty rule: `gui-only` means KiCad genuinely exposes no cli/ipc/file path for
# that command. It is a KiCad limit, not a missing feature here, and such rows are
# excluded from the coverage denominator. If a headless path exists but this server
# does not drive it yet, the channel is the reachable one and `status: gap`.

schema_version: 1
kicad_version: "10.0.6"

channels:
  mcp: "A registered MCP tool drives this command directly."
  cli: "Reachable by running a kicad-cli subcommand (fully headless)."
  file: "Reachable by editing the .kicad_pcb / .kicad_sch / .kicad_pro S-expression or JSON."
  ipc: "Reachable through the KiCad IPC API against a running KiCad instance."
  gui-only: "Interactive-only. KiCad exposes no cli, ipc or file path for it."

statuses:
  covered: "An MCP tool fully drives this menu command."
  partial: "Partly driven, or driven with a tracked limitation."
  gap: "KiCad exposes a headless path but no MCP tool drives it yet."
  gui-only: "No headless path exists in KiCad. Excluded from the coverage denominator."

default_binding:
  channel: gui-only
  status: gui-only
  notes: "Unclassified interactive command."

# ---------------------------------------------------------------------------
# Namespace rules: KiCad encodes a command's nature in its action name, so the
# tool namespace is a reliable default. Ordered; first matching prefix wins.
# ---------------------------------------------------------------------------
namespace_rules:
  - prefix: "pcbnew.InteractiveRouter."
    channel: gui-only
    status: gui-only
    notes: >-
      Push-and-shove routing is driven by live pointer input. Headless routing is
      offered instead by route_single_track / route_differential_pair, which write
      geometry directly rather than replaying the interactive router.

  - prefix: "pcbnew.LengthTuner."
    channel: gui-only
    status: gui-only
    notes: "Interactive meander tuning; route_tune_length is the headless analogue."

  - prefix: "pcbnew.MicrowaveTool."
    channel: gui-only
    status: gui-only
    notes: "Microwave shape tools are canvas-driven with no scripted entry point."

  - prefix: "pcbnew.InteractiveDrawing."
    channel: gui-only
    status: gui-only
    notes: "Canvas drawing tool: requires pointer input on a live editor canvas."

  - prefix: "eeschema.SymbolDrawing."
    channel: gui-only
    status: gui-only
    notes: "Symbol-editor canvas drawing tool."

  - prefix: "plEditor.InteractiveDrawing."
    channel: gui-only
    status: gui-only
    notes: "Drawing-sheet editor canvas tool."

  - prefix: "eeschema.NavigateTool."
    channel: gui-only
    status: gui-only
    notes: "Viewport navigation; meaningless without a window."

  - prefix: "common.Interactive."
    channel: gui-only
    status: gui-only
    notes: "Clipboard, selection and undo act on live editor state."

  - prefix: "common.Checker."
    channel: gui-only
    status: gui-only
    notes: >-
      Marker navigation walks the GUI's violation list. run_drc / run_erc return the
      same violations as data, and drc_add_exclusion records the exclusions.

  - prefix: "gerbview."
    channel: gui-only
    status: gui-only
    notes: >-
      GerbView is a viewer with no headless surface. Gerber generation is covered by
      export_gerber; inspection of generated art is not scriptable in KiCad 10.

  - prefix: "plEditor."
    channel: gui-only
    status: gui-only
    notes: "Drawing Sheet Editor has no kicad-cli or IPC surface in KiCad 10."

  - prefix: "cvpcb."
    channel: gui-only
    status: gui-only
    notes: >-
      CvPcb is an interactive assignment UI. lib_assign_footprint performs the same
      schematic edit headlessly.

  - prefix: "eeschema.InteractiveDrawing."
    channel: gui-only
    status: gui-only
    notes: "Schematic canvas drawing tool; the place* commands have explicit headless bindings."

  - prefix: "eeschema.InteractiveDrawingLineWireBus."
    channel: gui-only
    status: gui-only
    notes: "Graphic line drawing; wires and buses have explicit headless bindings."

  - prefix: "eeschema.RemoteSymbols."
    channel: gui-only
    status: gui-only
    notes: "Docked panel."

  - prefix: "eeschema.SchDesignBlockControl."
    channel: gui-only
    status: gui-only
    notes: "Docked panel; design blocks are not modelled by this server."

  - prefix: "pcbnew.PcbDesignBlockControl."
    channel: gui-only
    status: gui-only
    notes: "Docked panel."

  - prefix: "pcbnew.Control."
    channel: gui-only
    status: gui-only
    notes: >-
      Rendering and display modes (sketch/filled, layer opacity, docked panels) change
      how the canvas draws, not the design. Nothing to drive headlessly.

  - prefix: "common.Control.zoom"
    channel: gui-only
    status: gui-only
    notes: "Viewport zoom."

  - prefix: "common.Control.toggle"
    channel: gui-only
    status: gui-only
    notes: "Canvas display toggle."

  - prefix: "common.Control.show"
    channel: gui-only
    status: gui-only
    notes: "Opens another editor window or docked panel."

  - prefix: "eeschema.EditorControl.show"
    channel: gui-only
    status: gui-only
    notes: "Canvas visibility toggle or docked panel."

  - prefix: "eeschema.EditorControl.toggle"
    channel: gui-only
    status: gui-only
    notes: "Canvas visibility toggle."

  - prefix: "eeschema.SymbolLibraryControl.showHidden"
    channel: gui-only
    status: gui-only
    notes: "Canvas visibility toggle."

  - prefix: "eeschema.InspectionTool.show"
    channel: gui-only
    status: gui-only
    notes: "Help popup."

  - prefix: "common.SuiteControl."
    channel: gui-only
    status: gui-only
    notes: "Application-level dialogs (about, help, hotkey list, bug report)."

# ---------------------------------------------------------------------------
# Per-action overrides.
# ---------------------------------------------------------------------------
overrides:

  # --- Design checks -------------------------------------------------------
  "pcbnew.DRCTool.runDRC":
    channel: mcp
    status: covered
    mcp_tool: run_drc
    cli_command: ["pcb", "drc"]
    notes: >-
      Inspect > Design Rules Checker. run_drc reports violations as structured data;
      the same check runs headlessly via `kicad-cli pcb drc`.

  "eeschema.InspectionTool.runERC":
    channel: mcp
    status: covered
    mcp_tool: run_erc
    cli_command: ["sch", "erc"]
    notes: "Inspect > Electrical Rules Checker, equivalent to `kicad-cli sch erc`."

  "pcbnew.DRETool.drcRuleEditor":
    channel: mcp
    status: covered
    mcp_tool: drc_rule_create
    notes: >-
      The custom-rule editor writes project DRC rules. drc_rule_create / drc_rule_delete
      / drc_rule_enable / drc_export_rules / drc_check_rule_conflicts drive the same
      rule set from files.

  "pcbnew.InspectionTool.InspectClearance":
    channel: mcp
    status: covered
    mcp_tool: pcb_get_design_rules
    notes: "Clearance resolution for a pair of items; pcb_get_design_rules reports the resolved constraints."

  "pcbnew.InspectionTool.InspectConstraints":
    channel: mcp
    status: covered
    mcp_tool: generate_board_constraints
    notes: "Constraint resolution report."

  "pcbnew.InspectionTool.ShowBoardStatistics":
    channel: mcp
    status: covered
    mcp_tool: get_board_stats
    cli_command: ["pcb", "export", "stats"]
    notes: "Also available as pcb_export_stats / `kicad-cli pcb export stats`."

  "pcbnew.InspectionTool.ShowFootprintAssociations":
    channel: mcp
    status: covered
    mcp_tool: validate_footprints_vs_schematic
    notes: "Cross-checks board footprints against schematic assignments."

  "pcbnew.InspectionTool.DiffFootprint":
    channel: mcp
    status: covered
    mcp_tool: lib_certify_footprint
    notes: "Compares a placed footprint against its library source."

  "pcbnew.ModuleEditor.checkFootprint":
    channel: mcp
    status: covered
    mcp_tool: lib_validate_footprint_ipc7351
    notes: "Footprint Checker; lib_certify_footprint adds library-contract checks."

  "eeschema.InspectionTool.checkSymbol":
    channel: mcp
    status: covered
    mcp_tool: lib_verify_component_contract
    notes: "Symbol Checker equivalent."

  "eeschema.InspectionTool.diffSymbol":
    channel: mcp
    status: partial
    mcp_tool: sch_visual_baseline_compare
    notes: >-
      Compare Symbol with Library. sch_visual_baseline_compare diffs rendered output;
      a field-level symbol-vs-library diff is not exposed as its own tool.

  "pcbnew.Control.showNetInspector":
    channel: mcp
    status: covered
    mcp_tool: pcb_net_inspector
    notes: "Net Inspector panel data, including per-net length and via counts."

  "pcbnew.Control.repairBoard":
    channel: mcp
    status: partial
    mcp_tool: pcb_upgrade
    notes: >-
      Repair Board rebuilds corrupt connectivity in memory. pcb_upgrade re-saves the
      board through KiCad's own loader, which fixes format-level damage but not every
      in-memory repair the GUI performs.

  "pcbnew.ModuleEditor.repairFootprint":
    channel: mcp
    status: partial
    mcp_tool: fp_upgrade
    notes: "fp_upgrade re-saves through KiCad's loader; not a full geometric repair."

  # --- Board Setup: stackup, rules, net classes ----------------------------
  "pcbnew.EditorControl.boardSetup":
    channel: mcp
    status: partial
    mcp_tool: pcb_get_stackup
    notes: >-
      Board Setup is a multi-page dialog. Headless equivalents exist per page:
      stackup -> pcb_get_stackup / pcb_set_stackup / si_generate_stackup /
      si_synthesize_stackup_for_interfaces; design rules -> pcb_get_design_rules,
      drc_rule_create; net classes -> route_set_net_class_rules; constraints ->
      generate_board_constraints. There is no single tool that opens the whole dialog,
      hence partial.

  "eeschema.EditorControl.schematicSetup":
    channel: mcp
    status: partial
    mcp_tool: erc_list_rules
    notes: >-
      Schematic Setup pages map to erc_list_rules / erc_set_rule_severity /
      erc_reset_rules (violation severities) and sch_set_title_block_info
      (page/title block). Field-name templates and bus alias editing are not exposed.

  "pcbnew.Control.zonesManager":
    channel: mcp
    status: partial
    mcp_tool: pcb_list_zones
    notes: >-
      pcb_list_zones reports every zone; pcb_set_zone_properties edits priority, name,
      minimum thickness and fill state (clearing stale fill geometry when unfilled).
      Net reassignment and per-zone clearance/thermal settings are not exposed yet.

  "pcbnew.ZoneFiller.zoneFillAll":
    channel: cli
    status: partial
    cli_command: ["pcb", "drc"]
    notes: >-
      KiCad has no standalone "fill zones" CLI verb. `kicad-cli pcb drc` and the plot/
      export commands refill zones as a side effect, so a DRC run is the headless way
      to force a refill before export.

  "pcbnew.ZoneFiller.zoneUnfillAll":
    channel: gui-only
    status: gui-only
    notes: "No headless unfill; zone fill state is regenerated on the next fill."

  # --- Fabrication outputs -------------------------------------------------
  "pcbnew.EditorControl.generateGerbers":
    channel: mcp
    status: covered
    mcp_tool: export_gerber
    cli_command: ["pcb", "export", "gerbers"]

  "pcbnew.EditorControl.generateDrillFiles":
    channel: mcp
    status: covered
    mcp_tool: export_drill
    cli_command: ["pcb", "export", "drill"]

  "pcbnew.EditorControl.generatePosFile":
    channel: mcp
    status: covered
    mcp_tool: export_pick_and_place
    cli_command: ["pcb", "export", "pos"]

  "pcbnew.EditorControl.generateIPC2581File":
    channel: mcp
    status: covered
    mcp_tool: export_ipc2581
    cli_command: ["pcb", "export", "ipc2581"]

  "pcbnew.EditorControl.generateODBPPFile":
    channel: mcp
    status: covered
    mcp_tool: export_odb
    cli_command: ["pcb", "export", "odb"]

  "pcbnew.EditorControl.generateD356File":
    channel: mcp
    status: covered
    mcp_tool: export_ipc_d356
    cli_command: ["pcb", "export", "ipcd356"]

  "pcbnew.EditorControl.generateBOM":
    channel: mcp
    status: covered
    mcp_tool: export_bom
    notes: "PCB-side BOM; export_bom reads the schematic BOM, variant_export_bom for variants."

  "pcbnew.EditorControl.generateReportFile":
    channel: mcp
    status: partial
    mcp_tool: pcb_export_stats
    notes: >-
      The .rpt footprint report has no kicad-cli verb. pcb_export_stats and
      pcb_get_footprints supply the same content in structured form.

  # --- PCB export ----------------------------------------------------------
  "pcbnew.EditorControl.exportSTEP":
    channel: mcp
    status: covered
    mcp_tool: export_step
    cli_command: ["pcb", "export", "step"]
    notes: "export_glb / export_brep / export_xao / export_ply / export_stl / export_stepz cover the sibling formats."

  "pcbnew.EditorControl.exportVRML":
    channel: mcp
    status: covered
    mcp_tool: export_vrml
    cli_command: ["pcb", "export", "vrml"]

  "pcbnew.EditorControl.exportGenCAD":
    channel: mcp
    status: covered
    mcp_tool: export_gencad
    cli_command: ["pcb", "export", "gencad"]

  "pcbnew.EditorControl.exportSpecctraDSN":
    channel: mcp
    status: covered
    mcp_tool: route_export_dsn

  "pcbnew.EditorControl.importSpecctraSession":
    channel: mcp
    status: covered
    mcp_tool: route_import_ses
    notes: "route_apply_ses applies the imported session to the board."

  "pcbnew.EditorControl.exportIDF":
    channel: gui-only
    status: gui-only
    notes: "IDFv3 export has no kicad-cli verb and no IPC entry point in KiCad 10.0.6."

  "pcbnew.EditorControl.exportHyperlynx":
    channel: gui-only
    status: gui-only
    notes: "Hyperlynx export is dialog-only in KiCad 10.0.6."

  "pcbnew.EditorControl.exportFootprintAssociations":
    channel: gui-only
    status: gui-only
    notes: "The .cmp association file is written only from the dialog."

  "pcbnew.EditorControl.exportFootprints":
    channel: mcp
    status: covered
    mcp_tool: fp_export
    notes: "Exports board footprints into a library."

  "common.Control.plot":
    channel: mcp
    status: covered
    mcp_tool: export_pcb_pdf
    cli_command: ["pcb", "export", "pdf"]
    notes: >-
      Plot targets the same engine as the export verbs: export_pcb_pdf / export_svg /
      export_dxf / export_ps for the board, export_sch_pdf / export_sch_svg /
      export_sch_dxf for the schematic.

  "common.Control.print":
    channel: cli
    status: partial
    cli_command: ["pcb", "export", "pdf"]
    notes: "Printing to a physical device is GUI-only; exporting a PDF is the headless equivalent."

  "pcbnew.EditorControl.collect3DModels":
    channel: mcp
    status: covered
    mcp_tool: project_embed_file
    notes: "Embeds referenced 3D models into the board file."

  # --- PCB import ----------------------------------------------------------
  "pcbnew.EditorControl.importNetlist":
    channel: mcp
    status: partial
    mcp_tool: validate_footprints_vs_schematic
    notes: >-
      Importing a netlist is the update-board-from-schematic path. See
      common.Control.updatePcbFromSchematic: no headless KiCad verb performs the
      full board update in 10.0.6.

  "pcbnew.EditorControl.openNonKicadBoard":
    channel: mcp
    status: covered
    mcp_tool: mfg_import_specctra
    cli_command: ["pcb", "import"]
    notes: "mfg_import_allegro / mfg_import_pads / mfg_import_geda cover the other source formats; mfg_check_import_support reports what the installed KiCad accepts."

  "pcbnew.EditorControl.appendBoard":
    channel: file
    status: gap
    notes: "Appending another board's contents has no CLI verb; it is a board-file merge."

  "pcbnew.EditorControl.rescueAutosave":
    channel: file
    status: gap
    notes: "Autosave recovery is a file operation on the _autosave_ sidecar."

  # --- PCB global edits ----------------------------------------------------
  "pcbnew.GlobalEdit.updateFootprints":
    channel: file
    status: gap
    notes: "Update Footprints from Library rewrites footprint definitions in .kicad_pcb; no CLI verb exists."

  "pcbnew.GlobalEdit.changeFootprints":
    channel: file
    status: gap
    notes: "Bulk footprint substitution in the board file."

  "pcbnew.GlobalEdit.editTracksAndVias":
    channel: mcp
    status: partial
    mcp_tool: route_set_net_class_rules
    notes: >-
      Net-class-driven track and via sizing is covered; per-selection overrides from the
      dialog are not.

  "pcbnew.GlobalEdit.editTextAndGraphics":
    channel: mcp
    status: partial
    mcp_tool: sch_normalize_text_sizes
    notes: "The schematic-side normaliser exists; the PCB-side bulk text/graphics edit does not."

  "pcbnew.GlobalEdit.editTeardrops":
    channel: file
    status: gap
    notes: "Teardrop settings live in the board file's (teardrops ...) blocks."

  "pcbnew.GlobalEdit.cleanupTracksAndVias":
    channel: mcp
    status: partial
    mcp_tool: pcb_cleanup_tracks_and_vias
    notes: >-
      Removes zero-length and exactly-duplicated tracks and vias. Collinear segment
      merging is deliberately excluded: it is only safe when the shared endpoint has no
      other connection, which needs full connectivity analysis rather than a file edit.

  "pcbnew.GlobalEdit.cleanupGraphics":
    channel: file
    status: gap
    notes: "Graphics cleanup has no headless verb."

  "pcbnew.GlobalEdit.removeUnusedPads":
    channel: file
    status: gap
    notes: "Unused-pad removal is a per-pad board-file property."

  "pcbnew.GlobalEdit.swapLayers":
    channel: mcp
    status: covered
    mcp_tool: pcb_swap_layers
    notes: >-
      Rewrites layer references throughout the board file. The mapping is applied
      simultaneously, so F.Cu<->B.Cu is a true swap; stackup layer definitions and
      wildcard pad layers are left alone.

  "pcbnew.GlobalEdit.globalDeletions":
    channel: mcp
    status: covered
    mcp_tool: pcb_global_delete
    notes: >-
      Deletes top-level board items by class, optionally filtered by layer and net,
      and skips locked items by default. Like the dialog, it does not reach items that
      belong to a footprint.

  "pcbnew.GlobalEdit.migrate3DModels":
    channel: mcp
    status: covered
    mcp_tool: lib_bulk_assign_3d_models
    notes: "lib_set_3d_model_path / lib_remove_3d_model handle individual moves."

  "pcbnew.ReannotateTool.ShowReannotateDialog":
    channel: file
    status: gap
    notes: "Geographical reannotation of PCB references; no CLI verb, board-file rewrite."

  "pcbnew.Autoplacer.autoplaceOffboard":
    channel: mcp
    status: partial
    mcp_tool: sch_auto_place_symbols
    notes: "Schematic auto-placement exists; PCB footprint autoplacement is not exposed headlessly."

  "pcbnew.Autoplacer.autoplaceSelected":
    channel: gui-only
    status: gui-only
    notes: "Operates on the live canvas selection."

  "pcbnew.Multichannel.repeatLayout":
    channel: gui-only
    status: gui-only
    notes: "Multichannel layout replication is driven from the GUI's rule areas."

  "pcbnew.Multichannel.generatePlacementRuleAreas":
    channel: gui-only
    status: gui-only

  "pcbnew.PadTool.enumeratePads":
    channel: file
    status: gap
    notes: "Pad renumbering inside a footprint; a footprint-file rewrite."

  "pcbnew.PadTool.defaultPadProperties":
    channel: file
    status: gap
    notes: "Editor default, stored in footprint editor settings."

  "pcbnew.ModuleEditor.padTable":
    channel: mcp
    status: covered
    mcp_tool: fp_get_info
    notes: "Reports the footprint's pad table."

  "pcbnew.ModuleEditor.footprintProperties":
    channel: mcp
    status: covered
    mcp_tool: fp_get_info

  "pcbnew.ModuleEditor.createFootprint":
    channel: mcp
    status: covered
    mcp_tool: lib_generate_footprint_ipc7351
    notes: "Generates an IPC-7351 compliant footprint headlessly."

  "pcbnew.ModuleEditor.newFootprint":
    channel: mcp
    status: covered
    mcp_tool: lib_generate_footprint_ipc7351

  "pcbnew.ModuleEditor.exportFootprint":
    channel: mcp
    status: covered
    mcp_tool: fp_export

  "pcbnew.Generator.regenerateAllTuning":
    channel: mcp
    status: covered
    mcp_tool: route_apply_tuning_profile
    notes: "route_create_tuning_profile / route_list_tuning_profiles manage the profiles."

  "pcbnew.Generator.regenerateAll":
    channel: gui-only
    status: gui-only
    notes: "Generator objects are rebuilt by the running editor."

  "pcbnew.Generator.regenerateSelected":
    channel: gui-only
    status: gui-only

  "pcbnew.Generator.showManager":
    channel: gui-only
    status: gui-only

  # --- Schematic authoring -------------------------------------------------
  "eeschema.InteractiveDrawing.placeSymbol":
    channel: mcp
    status: covered
    mcp_tool: sch_add_symbol
    notes: "sch_add_component resolves a library part by name."

  "eeschema.InteractiveDrawing.placePowerSymbol":
    channel: mcp
    status: covered
    mcp_tool: sch_add_power_symbol

  "eeschema.InteractiveDrawing.placeLabel":
    channel: mcp
    status: covered
    mcp_tool: sch_add_label

  "eeschema.InteractiveDrawing.placeGlobalLabel":
    channel: mcp
    status: covered
    mcp_tool: sch_add_global_label

  "eeschema.InteractiveDrawing.placeHierarchicalLabel":
    channel: mcp
    status: covered
    mcp_tool: sch_add_hierarchical_label

  "eeschema.InteractiveDrawing.placeClassLabel":
    channel: mcp
    status: partial
    mcp_tool: sch_add_label
    notes: "Directive (netclass) labels are written as labels; no dedicated netclass-label tool."

  "eeschema.InteractiveDrawing.placeJunction":
    channel: mcp
    status: covered
    mcp_tool: sch_add_missing_junctions
    notes: "Adds the junctions the schematic's topology requires."

  "eeschema.InteractiveDrawing.placeNoConnect":
    channel: mcp
    status: covered
    mcp_tool: sch_add_no_connect
    notes: "sch_delete_no_connect removes them."

  "eeschema.InteractiveDrawing.placeBusWireEntry":
    channel: mcp
    status: covered
